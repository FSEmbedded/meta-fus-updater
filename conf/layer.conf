# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "fus-updater"
BBFILE_PATTERN_fus-updater = "^${LAYERDIR}/"
LAYER_BASE_DIR = "${LAYERDIR}"
BBFILE_PRIORITY_fus-updater = "10"

# Single source of truth for the persistent read-write overlay root. Defined here
# (layer.conf is parsed before machine/distro conf and is globally visible) so all
# fsup recipes and downstream layers derive the path instead of hardcoding it.
# Override in machine/distro conf with '=' if a board needs a different location.
FUS_PERSISTENT_ROOT ?= "/rw_fs/root"

# Application image store on the persistent overlay. Named separately because it
# is referenced on its own by several consumers (overlay mount, app A/B slots,
# image exclude, updater app store). Derives from the root by default.
FUS_APPLICATION_DIR ?= "${FUS_PERSISTENT_ROOT}/application"

LAYERDEPENDS_fus-updater = "core fus-bsp-release rauc"

LAYERSERIES_COMPAT_fus-updater = "kirkstone scarthgap"

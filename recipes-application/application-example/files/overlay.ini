[ApplicationFolder]
folder_1=/etc
folder_2=/usr/local/bin
folder_3=/usr/lib/systemd/system
folder_4=/usr/lib/systemd/system-generators

[PersistentMemory.etc]
lowerdir=/etc
upperdir=/rw_fs/root/upper/etc
workdir=/rw_fs/root/work/etc
mergedir=/etc

[PersistentMemory.mnt]
lowerdir=/mnt
upperdir=/rw_fs/root/upper/mnt
workdir=/rw_fs/root/work/mnt
mergedir=/mnt

[PersistentMemory.usr/local/bin]
lowerdir=/usr/local/bin
upperdir=/rw_fs/root/upper/usr/local/bin
workdir=/rw_fs/root/work/usr/local/bin
mergedir=/usr/local/bin
